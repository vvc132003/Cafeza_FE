    <div class="date-filter">

        <label>
            Đến ngày:
            <input type="date" [(ngModel)]="toDate" />
        </label>

        <button (click)="onFilter()">Lọc</button>
    </div>
    <br>
    <div class="row">

    <lib-mixed-canvas [revenueData]="revenueData" [orderCountData]="orderCountData"></lib-mixed-canvas>
