<app-layout [text]="'Quản lý bàn'" (showButtonss)="evetnbuttons($event)" [buttonNone]="showButtonsnone" [count]="count"
    (showPupAdd)="click($event)" [tabTemplates]="{tableList}">
</app-layout>

<ng-template #tableList>
    <div class="bottom-card">
        <div class="d-flex justify-content-end">
            <div *ngIf="dropdowns.length > 0" class="dropdown">
                <button class="btn btn-sm btn-secondary" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    <i class="fa fa-bars"></i>
                </button>
                <ul style="z-index: 100000; cursor: pointer;" class="dropdown-menu dropdown-menu-end"
                    aria-labelledby="dropdownMenuButton">
                    <li *ngFor="let item of dropdowns">
                        <a class="dropdown-item" (click)="toggleSection(item.action)">
                            <i class="fa" [ngClass]="item.icon"></i> {{ item.label }}
                        </a>
                    </li>
                </ul>
            </div>
        </div>
        <app-table-list *ngIf="showBoard" [tables]="tables" (doubleClick)="onTableDoubleClick($event)" [selectTable]="selectTable" (table)="clickTable($event)"></app-table-list>
        <app-table-kaban *ngIf="showKaban" [tables]="tables" (doubleClick)="onTableDoubleClick($event)"  (tableSelected)="clickTable($event)" (tableDropped)="handleTableDropped($event)"></app-table-kaban>
    </div>
</ng-template>

<!-- <ng-container *ngIf="showAdd"> -->
<app-table-add [listTablesparentId]="tables" [showoffcanvas]="showoffcanvas" [table]="table" [data]="data"
    (closePupAdd)="close()"></app-table-add>
<!-- </ng-container> -->

<app-select-order-type [isTypeOpen]="isTypeOpen" [tableId]="tableId" (showOrder_Type)="showOrderType()"
    (closeTypeModal)="closeType()"></app-select-order-type>

<app-order-add [showoffcanvas]="showoffOrder" [tableId]="tableId" [data]="data"
    (closePupAddOrder)="close()"></app-order-add>

<div class="custom-toast" *ngIf="showToast">
    {{ toastMessage }}
</div>
