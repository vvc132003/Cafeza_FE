<app-navbar [cartCount]="cartCount" (searchChanged)="onSearchChange($event)"></app-navbar>

<div class="container">
    <div *ngIf="showHeader=== false" class="toolbar-title">
        <strong>Trang chủ</strong> / {{ text }}
    </div>
    <app-header *ngIf="showHeader" (quantityChanged)="updatecartCount()" [keyword]="keywordFromNavbar"></app-header>
</div>
<app-chat [data]="conversations"></app-chat>
<app-chat-ai [data]="conversations"></app-chat-ai>
