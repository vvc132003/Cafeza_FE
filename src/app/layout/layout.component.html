<div class="admin-layout">
  <app-header></app-header>
  <app-admin-toolbar [text]="text" (showPupAdd)="onChildClick($event)"></app-admin-toolbar>
  <div class="admin-body">
    <app-sidebar></app-sidebar>
    <div class="admin-content">
      <!-- <router-outlet></router-outlet> -->
      <ng-container *ngFor="let entry of tabTemplates | keyvalue">
        <ng-container [ngTemplateOutlet]="entry.value"></ng-container>
      </ng-container>
    </div>
  </div>
</div>
