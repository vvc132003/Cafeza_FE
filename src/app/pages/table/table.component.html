<app-layout [text]="'Quản lý bàn'" (showButtonss)="evetnbuttons($event)" [buttonNone]="showButtonsnone" [count]="count"
    (showPupAdd)="click($event)" [tabTemplates]="{tableList}">
</app-layout>

<ng-template #tableList>
    <div class="bottom-card">
        <app-table-list [tables]="tables" [selectTable]="selectTable"></app-table-list>
    </div>
</ng-template>

<!-- <ng-container *ngIf="showAdd"> -->
<app-table-add [listTablesparentId]="tables" (newPupAdd)="newData($event)" [showoffcanvas]="showoffcanvas"
    [table]="table" [data]="data" (closePupAdd)="close()"></app-table-add>
<!-- </ng-container> -->
