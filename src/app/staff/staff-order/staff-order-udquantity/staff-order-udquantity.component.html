<div [class.show]="isorderdetailOpen" class="overlay"></div>
<div class="card category-icon-card" [class.show]="isorderdetailOpen">
    <div class="card-body">
        <button class="btn-close position-absolute top-0 end-0 m-2" (click)="close()"></button>
        <h5 class="card-title text-center">Cập nhật số lượng</h5>
        <div class="mb-3">
            <label for="quantity" class="form-label small">Số lượng</label>
            <input type="number" class="form-control form-control-sm" id="quantity" name="quantity"
                [(ngModel)]="data.quantity">
        </div>
        <div class="mb-3">
            <label for="note" class="form-label small">Ghi chú</label>
            <!-- <input type="text" class="form-control form-control-sm" id="note" name="note" [(ngModel)]="data.note"> -->
            <textarea class="form-control form-control-sm" [(ngModel)]="data.note" id="note" name="note" rows="6"
                cols="50"></textarea>
        </div>
        <div class="d-flex justify-content-end mt-3">
            <button class="btn btn-primary px-4" (click)="selectQuantity()">
                <i class="fa fa-save"></i> Lưu
            </button>
        </div>
    </div>
</div>
